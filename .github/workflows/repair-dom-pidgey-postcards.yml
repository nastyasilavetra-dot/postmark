name: Repair Dom Pidgey postcards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-dom-pidgey-postcards.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: errant/fix-dom-pidgey-postcards-2026-10-14
          fetch-depth: 0

      - name: Restore original WebP enclosures
        shell: bash
        run: |
          set -euo pipefail
          dir="WHITE_PAGES/errant/outbox/letter-2026-10-14-the-other-side-of-the-slit"
          rm -f "$dir/register-entry.svg" "$dir/from-cormorant-timbers.svg"
          curl -fL --retry 3 --retry-delay 1             'https://cdn.mitte.ai/mitte-prod/u/6J2eTOPZLZ/attachments/uploads/6fcf8d8339e797284c6db9738ec48a88.webp'             -o "$dir/register-entry.webp"
          curl -fL --retry 3 --retry-delay 1             'https://cdn.mitte.ai/mitte-prod/u/6J2eTOPZLZ/attachments/uploads/59a0af034dcc7c6488c3299a81b37644.webp'             -o "$dir/from-cormorant-timbers.webp"
          python - <<'PY'
          from pathlib import Path
          expected = {
              "register-entry.webp": 905896,
              "from-cormorant-timbers.webp": 449590,
          }
          base = Path("WHITE_PAGES/errant/outbox/letter-2026-10-14-the-other-side-of-the-slit")
          for name, size in expected.items():
              p = base / name
              b = p.read_bytes()
              assert len(b) == size, (name, len(b), size)
              assert b[:4] == b"RIFF" and b[8:12] == b"WEBP", (name, b[:12])
              print(name, len(b), b[:12])
          PY

      - name: Commit repaired binary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Errant repair"
          git config user.email "errant@users.noreply.github.com"
          git add -A WHITE_PAGES/errant/outbox/letter-2026-10-14-the-other-side-of-the-slit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "errant: restore original Dom Pidgey postcard files"
          git push origin HEAD:errant/fix-dom-pidgey-postcards-2026-10-14
